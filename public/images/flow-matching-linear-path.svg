<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Linear conditional probability path in flow matching</title>
  <desc id="desc">A paired data sample x0 and noise sample x1 define interpolated states xt. Training matches the vector field, while generation integrates from noise at t equals one toward data at t equals zero.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#3fb950"/></marker>
  </defs>
  <rect width="1200" height="560" rx="8" fill="#0d1117"/>
  <text x="56" y="62" fill="#f0f6fc" font-family="Arial,sans-serif" font-size="30" font-weight="700">A straight conditional path gives a simple target velocity</text>
  <text x="56" y="94" fill="#8b949e" font-family="Arial,sans-serif" font-size="16">x(t) = (1 - t)x0 + tx1, so the conditional target is constant along each paired path.</text>
  <g font-family="Arial,sans-serif">
    <line x1="170" y1="292" x2="1030" y2="292" stroke="#30363d" stroke-width="8" stroke-linecap="round"/>
    <line x1="1030" y1="292" x2="190" y2="292" stroke="#3fb950" stroke-width="5" marker-end="url(#a)"/>
    <g>
      <circle cx="190" cy="292" r="42" fill="#161b22" stroke="#d29922" stroke-width="3"/>
      <circle cx="400" cy="292" r="28" fill="#161b22" stroke="#bc8cff" stroke-width="3"/>
      <circle cx="610" cy="292" r="28" fill="#161b22" stroke="#bc8cff" stroke-width="3"/>
      <circle cx="820" cy="292" r="28" fill="#161b22" stroke="#bc8cff" stroke-width="3"/>
      <circle cx="1030" cy="292" r="42" fill="#161b22" stroke="#58a6ff" stroke-width="3"/>
    </g>
    <text x="190" y="299" text-anchor="middle" fill="#d29922" font-size="20" font-weight="700">x0</text>
    <text x="400" y="299" text-anchor="middle" fill="#f0f6fc" font-size="15">xt</text><text x="610" y="299" text-anchor="middle" fill="#f0f6fc" font-size="15">xt</text><text x="820" y="299" text-anchor="middle" fill="#f0f6fc" font-size="15">xt</text>
    <text x="1030" y="299" text-anchor="middle" fill="#58a6ff" font-size="20" font-weight="700">x1</text>
    <g fill="#8b949e" font-size="13" text-anchor="middle"><text x="190" y="362">t = 0 · data</text><text x="400" y="344">t = .25</text><text x="610" y="344">t = .50</text><text x="820" y="344">t = .75</text><text x="1030" y="362">t = 1 · noise</text></g>
    <rect x="126" y="408" width="948" height="84" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="158" y="440" fill="#3fb950" font-size="14" font-weight="700">GENERATION</text>
    <text x="300" y="440" fill="#c9d1d9" font-size="14">integrate from noise toward data</text>
    <text x="158" y="472" fill="#bc8cff" font-size="14" font-weight="700">TRAINING</text>
    <text x="300" y="472" fill="#c9d1d9" font-size="14">sample (x0, x1, t), regress vtheta(xt, t) toward x1 - x0</text>
  </g>
</svg>
