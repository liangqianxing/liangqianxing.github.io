<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc">
  <title id="title">LoRA 低秩适配机制示意</title>
  <desc id="desc">输入 x 同时经过冻结的预训练权重 W 和可训练的低秩分支 A、B，两路输出相加得到 h；推理时低秩增量可合并回 W，不增加延迟。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c9d1d9"/></marker></defs>
  <rect width="1080" height="520" rx="8" fill="#0d1117"/>
  <text x="540" y="50" text-anchor="middle" fill="#f0f6fc" font-family="Arial,sans-serif" font-size="25" font-weight="700">LoRA：冻结主干，只学一个低秩增量（本文原创重绘）</text>
  <text x="540" y="78" text-anchor="middle" fill="#8b949e" font-family="Arial,sans-serif" font-size="14">h = W&#8320;x + &#916;Wx = W&#8320;x + BAx，秩 r 远小于 d</text>

  <g font-family="Arial,sans-serif">
    <circle cx="90" cy="280" r="26" fill="#161b22" stroke="#f0f6fc" stroke-width="1.5"/>
    <text x="90" y="286" text-anchor="middle" fill="#f0f6fc" font-size="17" font-weight="700">x</text>

    <path d="M116 268C160 240 170 190 206 176" fill="none" stroke="#c9d1d9" stroke-width="2.5" marker-end="url(#a)"/>
    <path d="M116 292C160 320 170 360 206 368" fill="none" stroke="#c9d1d9" stroke-width="2.5" marker-end="url(#a)"/>

    <rect x="210" y="120" width="170" height="110" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="295" y="165" text-anchor="middle" fill="#79c0ff" font-size="19" font-weight="700">W&#8320;</text>
    <text x="295" y="190" text-anchor="middle" fill="#8b949e" font-size="13">d &#215; d · 预训练权重</text>
    <rect x="224" y="238" width="142" height="26" rx="13" fill="#0d1117" stroke="#58a6ff"/>
    <text x="295" y="256" text-anchor="middle" fill="#79c0ff" font-size="12.5">冻结 · 不训练</text>

    <rect x="210" y="346" width="110" height="52" rx="10" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <text x="265" y="369" text-anchor="middle" fill="#e3b341" font-size="17" font-weight="700">A</text>
    <text x="265" y="389" text-anchor="middle" fill="#8b949e" font-size="12">r &#215; d</text>
    <rect x="400" y="322" width="62" height="100" rx="10" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <text x="431" y="365" text-anchor="middle" fill="#e3b341" font-size="17" font-weight="700">B</text>
    <text x="431" y="385" text-anchor="middle" fill="#8b949e" font-size="12">d &#215; r</text>
    <path d="M320 372H394" fill="none" stroke="#c9d1d9" stroke-width="2.5" marker-end="url(#a)"/>

    <path d="M380 175C470 175 480 230 534 254" fill="none" stroke="#c9d1d9" stroke-width="2.5" marker-end="url(#a)"/>
    <path d="M462 360C500 340 505 320 534 300" fill="none" stroke="#c9d1d9" stroke-width="2.5" marker-end="url(#a)"/>

    <circle cx="560" cy="278" r="24" fill="#161b22" stroke="#f0f6fc" stroke-width="1.5"/>
    <text x="560" y="285" text-anchor="middle" fill="#f0f6fc" font-size="18" font-weight="700">+</text>
    <path d="M584 278H660" fill="none" stroke="#c9d1d9" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="664" y="248" width="70" height="60" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="699" y="285" text-anchor="middle" fill="#56d364" font-size="18" font-weight="700">h</text>

    <rect x="780" y="120" width="252" height="290" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="800" y="152" fill="#f0f6fc" font-size="15" font-weight="700">为什么高效</text>
    <g fill="#c9d1d9" font-size="12.5">
      <text x="800" y="182">· 秩 r 常取 4&#8211;64，可训练</text>
      <text x="812" y="202">参数通常不足总量 1%</text>
      <text x="800" y="232">· 主干冻结，优化器状态与</text>
      <text x="812" y="252">梯度显存大幅下降</text>
      <text x="800" y="282">· 推理时 BA 可合并回 W&#8320;，</text>
      <text x="812" y="302">不增加任何延迟</text>
      <text x="800" y="332">· 多任务只需替换轻量分支，</text>
      <text x="812" y="352">便于个性化分发</text>
    </g>
    <text x="800" y="386" fill="#8b949e" font-size="11.5">机制重绘自 LoRA（ICLR 2022），</text>
    <text x="800" y="402" fill="#8b949e" font-size="11.5">arXiv:2106.09685</text>
  </g>

  <rect x="48" y="452" width="984" height="40" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="540" y="477" text-anchor="middle" fill="#c9d1d9" font-family="Arial,sans-serif" font-size="13.5">直觉：下游任务需要的权重变化往往是低秩的 —— 与其微调整个矩阵，不如只学两个小矩阵的乘积</text>
</svg>
