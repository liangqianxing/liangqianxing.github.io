<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">视觉 Token 剪枝：让模型只看重要的 Patch</title>
  <desc id="desc">图像被切成视觉 Token 后，按注意力或多样性评分保留少量重要 Token 进入大语言模型，其余被剪除，序列变短使注意力开销近似平方下降。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c9d1d9"/></marker></defs>
  <rect width="1120" height="560" rx="8" fill="#0d1117"/>
  <text x="560" y="50" text-anchor="middle" fill="#f0f6fc" font-family="Arial,sans-serif" font-size="25" font-weight="700">视觉 Token 剪枝：多模态模型特有的加速杠杆（本文原创示意）</text>
  <text x="560" y="78" text-anchor="middle" fill="#8b949e" font-family="Arial,sans-serif" font-size="14">注意力开销随序列长度近似平方增长 —— 砍掉一半 Token，速度提升远不止一半</text>

  <g font-family="Arial,sans-serif">
    <text x="150" y="122" text-anchor="middle" fill="#79c0ff" font-size="14.5" font-weight="700">1. 图像被切成 Patch</text>
    <g stroke="#30363d" stroke-width="1.5">
      <rect x="70" y="136" width="40" height="40" fill="#161b22"/><rect x="110" y="136" width="40" height="40" fill="#161b22"/><rect x="150" y="136" width="40" height="40" fill="#58a6ff" opacity="0.55"/><rect x="190" y="136" width="40" height="40" fill="#58a6ff" opacity="0.55"/>
      <rect x="70" y="176" width="40" height="40" fill="#161b22"/><rect x="110" y="176" width="40" height="40" fill="#58a6ff" opacity="0.55"/><rect x="150" y="176" width="40" height="40" fill="#58a6ff" opacity="0.8"/><rect x="190" y="176" width="40" height="40" fill="#58a6ff" opacity="0.55"/>
      <rect x="70" y="216" width="40" height="40" fill="#161b22"/><rect x="110" y="216" width="40" height="40" fill="#58a6ff" opacity="0.55"/><rect x="150" y="216" width="40" height="40" fill="#58a6ff" opacity="0.8"/><rect x="190" y="216" width="40" height="40" fill="#161b22"/>
      <rect x="70" y="256" width="40" height="40" fill="#161b22"/><rect x="110" y="256" width="40" height="40" fill="#161b22"/><rect x="150" y="256" width="40" height="40" fill="#161b22"/><rect x="190" y="256" width="40" height="40" fill="#161b22"/>
    </g>
    <text x="150" y="322" text-anchor="middle" fill="#8b949e" font-size="12">高亮区域 = 视觉显著目标</text>

    <path d="M244 216H292" fill="none" stroke="#c9d1d9" stroke-width="3" marker-end="url(#a)"/>

    <text x="440" y="122" text-anchor="middle" fill="#79c0ff" font-size="14.5" font-weight="700">2. 编码后给每个 Token 打分</text>
    <g>
      <g stroke-width="1.5">
        <rect x="306" y="160" width="34" height="96" rx="6" fill="#58a6ff" opacity="0.85" stroke="#58a6ff"/>
        <rect x="348" y="160" width="34" height="96" rx="6" fill="#161b22" stroke="#484f58"/>
        <rect x="390" y="160" width="34" height="96" rx="6" fill="#58a6ff" opacity="0.55" stroke="#58a6ff"/>
        <rect x="432" y="160" width="34" height="96" rx="6" fill="#161b22" stroke="#484f58"/>
        <rect x="474" y="160" width="34" height="96" rx="6" fill="#58a6ff" opacity="0.85" stroke="#58a6ff"/>
        <rect x="516" y="160" width="34" height="96" rx="6" fill="#161b22" stroke="#484f58"/>
        <rect x="558" y="160" width="34" height="96" rx="6" fill="#161b22" stroke="#484f58"/>
      </g>
      <g font-size="16" text-anchor="middle">
        <text x="365" y="284" fill="#f85149">&#10007;</text>
        <text x="449" y="284" fill="#f85149">&#10007;</text>
        <text x="533" y="284" fill="#f85149">&#10007;</text>
        <text x="575" y="284" fill="#f85149">&#10007;</text>
      </g>
    </g>
    <text x="449" y="322" text-anchor="middle" fill="#8b949e" font-size="12">灰色 = 低分 Token，直接剪除</text>

    <path d="M606 216H654" fill="none" stroke="#c9d1d9" stroke-width="3" marker-end="url(#a)"/>

    <text x="800" y="122" text-anchor="middle" fill="#56d364" font-size="14.5" font-weight="700">3. 只保留高分 Token</text>
    <g stroke="#3fb950" stroke-width="1.5" fill="#161b22">
      <rect x="668" y="160" width="40" height="96" rx="6"/>
      <rect x="716" y="160" width="40" height="96" rx="6"/>
      <rect x="764" y="160" width="40" height="96" rx="6"/>
    </g>
    <g fill="#56d364" font-size="13" text-anchor="middle">
      <text x="688" y="212">T1</text><text x="736" y="212">T2</text><text x="784" y="212">T3</text>
    </g>
    <text x="736" y="322" text-anchor="middle" fill="#8b949e" font-size="12">序列从 N 缩到 k，k 远小于 N</text>

    <path d="M818 216H866" fill="none" stroke="#c9d1d9" stroke-width="3" marker-end="url(#a)"/>

    <rect x="880" y="150" width="190" height="130" rx="10" fill="#161b22" stroke="#f0f6fc" stroke-width="1.5"/>
    <text x="975" y="196" text-anchor="middle" fill="#f0f6fc" font-size="17" font-weight="700">大语言模型</text>
    <text x="975" y="224" text-anchor="middle" fill="#8b949e" font-size="12.5">更短的视觉序列</text>
    <text x="975" y="246" text-anchor="middle" fill="#8b949e" font-size="12.5">更小的 KV Cache</text>

    <rect x="48" y="372" width="1024" height="150" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="72" y="404" fill="#f0f6fc" font-size="14.5" font-weight="700">评分准则与代表工作（本专题文献池）</text>
    <g font-size="13" fill="#c9d1d9">
      <text x="72" y="434"><tspan fill="#79c0ff" font-weight="700">注意力打分</tspan>　DynamicViT（NeurIPS 2021）&#183; SPViT（ECCV 2022）&#183; FastV（ECCV 2024）</text>
      <text x="72" y="460"><tspan fill="#79c0ff" font-weight="700">多样性 / 合并</tspan>　DivPrune（CVPR 2025）&#183; LLaVA-PruMerge（ICCV 2025）</text>
      <text x="72" y="486"><tspan fill="#79c0ff" font-weight="700">视频时序压缩</tspan>　DyCoke（CVPR 2025）&#183; VoCo-LLaMA（CVPR 2025）</text>
    </g>
    <text x="72" y="512" fill="#8b949e" font-size="12.5">相关思路还有 Token 重组（TokenLearner，ICLR 2022）、自适应深度（AdaViT，CVPR 2022）与稠密预测专用剪枝（ICCV 2023）</text>
  </g>
</svg>
