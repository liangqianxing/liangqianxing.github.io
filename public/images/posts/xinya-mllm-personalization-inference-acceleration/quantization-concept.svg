<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
  <title id="title">量化：把高精度权重压缩为低比特表示</title>
  <desc id="desc">左侧 FP16 浮点权重矩阵经缩放取整映射为右侧 INT4 整数矩阵，显存占用降为约四分之一；底部给出从 1-bit 到 GPTQ 的方法演进。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c9d1d9"/></marker></defs>
  <rect width="1120" height="540" rx="8" fill="#0d1117"/>
  <text x="560" y="50" text-anchor="middle" fill="#f0f6fc" font-family="Arial,sans-serif" font-size="25" font-weight="700">量化 Quantization：用更少比特存同一个模型（本文原创示意）</text>
  <text x="560" y="78" text-anchor="middle" fill="#8b949e" font-family="Arial,sans-serif" font-size="14">核心映射：整数值 = round(浮点权重 &#247; 缩放因子)，配合零点偏移保留数值范围</text>

  <g font-family="Arial,sans-serif">
    <text x="200" y="126" text-anchor="middle" fill="#79c0ff" font-size="15" font-weight="700">原始权重 · FP16</text>
    <g font-size="12.5" text-anchor="middle" fill="#f0f6fc">
      <g stroke="#58a6ff" fill="#161b22">
        <rect x="96" y="140" width="52" height="44" rx="6"/><rect x="152" y="140" width="52" height="44" rx="6"/><rect x="208" y="140" width="52" height="44" rx="6"/><rect x="264" y="140" width="52" height="44" rx="6"/>
        <rect x="96" y="188" width="52" height="44" rx="6"/><rect x="152" y="188" width="52" height="44" rx="6"/><rect x="208" y="188" width="52" height="44" rx="6"/><rect x="264" y="188" width="52" height="44" rx="6"/>
        <rect x="96" y="236" width="52" height="44" rx="6"/><rect x="152" y="236" width="52" height="44" rx="6"/><rect x="208" y="236" width="52" height="44" rx="6"/><rect x="264" y="236" width="52" height="44" rx="6"/>
        <rect x="96" y="284" width="52" height="44" rx="6"/><rect x="152" y="284" width="52" height="44" rx="6"/><rect x="208" y="284" width="52" height="44" rx="6"/><rect x="264" y="284" width="52" height="44" rx="6"/>
      </g>
      <text x="122" y="167">0.83</text><text x="178" y="167">-1.27</text><text x="234" y="167">0.41</text><text x="290" y="167">2.06</text>
      <text x="122" y="215">-0.35</text><text x="178" y="215">1.62</text><text x="234" y="215">-0.91</text><text x="290" y="215">0.18</text>
      <text x="122" y="263">1.04</text><text x="178" y="263">-2.33</text><text x="234" y="263">0.57</text><text x="290" y="263">-0.72</text>
      <text x="122" y="311">0.29</text><text x="178" y="311">1.88</text><text x="234" y="311">-1.45</text><text x="290" y="311">0.96</text>
    </g>
    <text x="206" y="356" text-anchor="middle" fill="#8b949e" font-size="12.5">每个权重 16 bit</text>

    <path d="M336 232H424" fill="none" stroke="#c9d1d9" stroke-width="3" marker-end="url(#a)"/>
    <text x="380" y="216" text-anchor="middle" fill="#c9d1d9" font-size="13" font-weight="700">缩放 + 取整</text>
    <text x="380" y="256" text-anchor="middle" fill="#8b949e" font-size="12">round(w / s) + z</text>

    <text x="592" y="126" text-anchor="middle" fill="#56d364" font-size="15" font-weight="700">量化后 · INT4</text>
    <g font-size="14" text-anchor="middle" fill="#f0f6fc">
      <g stroke="#3fb950" fill="#161b22">
        <rect x="488" y="140" width="52" height="44" rx="6"/><rect x="544" y="140" width="52" height="44" rx="6"/><rect x="600" y="140" width="52" height="44" rx="6"/><rect x="656" y="140" width="52" height="44" rx="6"/>
        <rect x="488" y="188" width="52" height="44" rx="6"/><rect x="544" y="188" width="52" height="44" rx="6"/><rect x="600" y="188" width="52" height="44" rx="6"/><rect x="656" y="188" width="52" height="44" rx="6"/>
        <rect x="488" y="236" width="52" height="44" rx="6"/><rect x="544" y="236" width="52" height="44" rx="6"/><rect x="600" y="236" width="52" height="44" rx="6"/><rect x="656" y="236" width="52" height="44" rx="6"/>
        <rect x="488" y="284" width="52" height="44" rx="6"/><rect x="544" y="284" width="52" height="44" rx="6"/><rect x="600" y="284" width="52" height="44" rx="6"/><rect x="656" y="284" width="52" height="44" rx="6"/>
      </g>
      <text x="514" y="168">3</text><text x="570" y="168">-5</text><text x="626" y="168">2</text><text x="682" y="168">7</text>
      <text x="514" y="216">-1</text><text x="570" y="216">6</text><text x="626" y="216">-4</text><text x="682" y="216">1</text>
      <text x="514" y="264">4</text><text x="570" y="264">-7</text><text x="626" y="264">2</text><text x="682" y="264">-3</text>
      <text x="514" y="312">1</text><text x="570" y="312">7</text><text x="626" y="312">-6</text><text x="682" y="312">4</text>
    </g>
    <text x="592" y="356" text-anchor="middle" fill="#8b949e" font-size="12.5">每个权重 4 bit，范围 -8 到 7</text>

    <rect x="756" y="140" width="316" height="188" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="776" y="172" fill="#f0f6fc" font-size="15" font-weight="700">直接收益</text>
    <g fill="#c9d1d9" font-size="12.5">
      <text x="776" y="200">· 显存占用约为 FP16 的 1/4</text>
      <text x="776" y="226">· 整数矩阵乘更快、更省电</text>
      <text x="776" y="252">· 70B 级模型可装进消费级显卡</text>
    </g>
    <text x="776" y="284" fill="#f0f6fc" font-size="15" font-weight="700">关键难点</text>
    <text x="776" y="310" fill="#c9d1d9" font-size="12.5">· 取整误差会累积，需精细校准</text>

    <rect x="48" y="396" width="1024" height="110" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="72" y="428" fill="#f0f6fc" font-size="14.5" font-weight="700">方法演进（本专题文献池）</text>
    <g font-size="13" fill="#c9d1d9">
      <text x="72" y="458"><tspan fill="#e3b341" font-weight="700">1-bit 时代</tspan>　BinaryConnect（NeurIPS 2015）&#8594; XNOR-Net（ECCV 2016）</text>
      <text x="72" y="484"><tspan fill="#e3b341" font-weight="700">训练后量化 PTQ</tspan>　4-bit PTQ（NeurIPS 2019）&#8594; AdaRound（ICML 2020）&#8594; GPTQ/OPTQ（ICLR 2023）</text>
    </g>
    <text x="640" y="458" fill="#8b949e" font-size="12.5">训练感知量化：Quantized Neural Networks（JMLR 2018）</text>
    <text x="640" y="484" fill="#8b949e" font-size="12.5">量化 + 微调交汇：QLoRA（NeurIPS 2023）的 NF4</text>
  </g>
</svg>
