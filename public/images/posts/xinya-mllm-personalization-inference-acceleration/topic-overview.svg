<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 656" role="img" aria-labelledby="title desc">
  <title id="title">专题全景：多模态大模型的个性化与推理加速</title>
  <desc id="desc">多模态大模型统一处理图像、文本、语音和视频；专题分为个性化（训练侧：参数高效微调、知识迁移、零样本少样本学习）与推理加速（推理侧：剪枝、量化、蒸馏、视觉 Token 压缩）两条主线。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#8b949e"/></marker></defs>
  <rect width="1200" height="656" rx="8" fill="#0d1117"/>
  <text x="600" y="54" text-anchor="middle" fill="#f0f6fc" font-family="Arial,sans-serif" font-size="28" font-weight="700">专题全景：多模态大模型的个性化与推理加速</text>
  <text x="600" y="84" text-anchor="middle" fill="#8b949e" font-family="Arial,sans-serif" font-size="15">同一个模型，两个优化维度 —— 训练侧让它适配任务，推理侧让它跑得更快</text>

  <rect x="430" y="110" width="340" height="78" rx="10" fill="#161b22" stroke="#f0f6fc" stroke-width="1.5"/>
  <text x="600" y="143" text-anchor="middle" fill="#f0f6fc" font-family="Arial,sans-serif" font-size="20" font-weight="700">多模态大模型（MLLM）</text>
  <text x="600" y="170" text-anchor="middle" fill="#8b949e" font-family="Arial,sans-serif" font-size="13">统一处理 图像 · 文本 · 语音 · 视频</text>

  <path d="M520 188C480 210 420 214 330 226" fill="none" stroke="#8b949e" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M680 188C720 210 780 214 870 226" fill="none" stroke="#8b949e" stroke-width="2.5" marker-end="url(#a)"/>

  <g font-family="Arial,sans-serif">
    <rect x="48" y="232" width="520" height="336" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="308" y="268" text-anchor="middle" fill="#58a6ff" font-size="20" font-weight="700">个性化 · 训练侧</text>
    <text x="308" y="292" text-anchor="middle" fill="#8b949e" font-size="13">用少量可训练参数，把通用模型适配到具体任务</text>
    <g>
      <rect x="72" y="310" width="472" height="74" rx="8" fill="#0d1117" stroke="#30363d"/>
      <text x="92" y="340" fill="#79c0ff" font-size="16" font-weight="700">参数高效微调（PEFT）</text>
      <text x="92" y="365" fill="#c9d1d9" font-size="13">LoRA、Adapter、Prompt Tuning：冻结主干，只训小模块</text>
      <rect x="72" y="398" width="472" height="74" rx="8" fill="#0d1117" stroke="#30363d"/>
      <text x="92" y="428" fill="#79c0ff" font-size="16" font-weight="700">知识迁移与任务适配</text>
      <text x="92" y="453" fill="#c9d1d9" font-size="13">把大模型能力迁移到分割、检测与推理感知任务</text>
      <rect x="72" y="486" width="472" height="74" rx="8" fill="#0d1117" stroke="#30363d"/>
      <text x="92" y="516" fill="#79c0ff" font-size="16" font-weight="700">零样本与少样本学习</text>
      <text x="92" y="541" fill="#c9d1d9" font-size="13">缺乏大规模标注时，依旧保持任务竞争力</text>
    </g>

    <rect x="632" y="232" width="520" height="336" rx="10" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <text x="892" y="268" text-anchor="middle" fill="#d29922" font-size="20" font-weight="700">推理加速 · 推理侧</text>
    <text x="892" y="292" text-anchor="middle" fill="#8b949e" font-size="13">降低推理阶段的计算量、显存占用与能耗</text>
    <g>
      <rect x="656" y="306" width="472" height="60" rx="8" fill="#0d1117" stroke="#30363d"/>
      <text x="676" y="331" fill="#e3b341" font-size="15" font-weight="700">剪枝 Pruning</text>
      <text x="676" y="352" fill="#c9d1d9" font-size="12.5">去除冗余结构与连接，提高模型稀疏性</text>
      <rect x="656" y="376" width="472" height="60" rx="8" fill="#0d1117" stroke="#30363d"/>
      <text x="676" y="401" fill="#e3b341" font-size="15" font-weight="700">量化 Quantization</text>
      <text x="676" y="422" fill="#c9d1d9" font-size="12.5">FP16 压到 INT8 / INT4，省显存、降功耗</text>
      <rect x="656" y="446" width="472" height="60" rx="8" fill="#0d1117" stroke="#30363d"/>
      <text x="676" y="471" fill="#e3b341" font-size="15" font-weight="700">蒸馏 Distillation</text>
      <text x="676" y="492" fill="#c9d1d9" font-size="12.5">大模型指导小模型，获得轻量化替代方案</text>
      <rect x="656" y="516" width="472" height="44" rx="8" fill="#0d1117" stroke="#30363d"/>
      <text x="676" y="543" fill="#e3b341" font-size="13.5" font-weight="700">视觉 Token 压缩：多模态模型特有的序列削减</text>
    </g>
  </g>

  <rect x="48" y="592" width="1104" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="600" y="620" text-anchor="middle" fill="#c9d1d9" font-family="Arial,sans-serif" font-size="15">共同目标：在有限算力下，让多模态大模型既“懂任务”又“跑得快”，走向真实场景落地</text>
</svg>
