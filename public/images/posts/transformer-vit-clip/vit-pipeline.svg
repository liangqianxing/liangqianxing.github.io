<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Vision Transformer Pipeline</title>
  <desc id="desc">图像被切分成 Patch，映射为 token，加入分类 token 和位置编码后进入 Transformer。</desc>
  <rect width="1200" height="560" rx="28" fill="#0b0f17"/>
  <text x="60" y="66" fill="#f8fafc" font-family="Arial,sans-serif" font-size="30" font-weight="700">Vision Transformer: Image → Patch Tokens</text>
  <g font-family="Arial,sans-serif">
    <rect x="72" y="132" width="260" height="260" rx="20" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
    <g stroke="#60a5fa" stroke-width="2" opacity="0.75">
      <path d="M137 132v260M202 132v260M267 132v260M72 197h260M72 262h260M72 327h260"/>
    </g>
    <text x="202" y="430" fill="#93c5fd" font-size="17" text-anchor="middle">Image H × W × C</text>
    <path d="M350 262h94" stroke="#64748b" stroke-width="4"/>
    <path d="m432 250 14 12-14 12" fill="none" stroke="#2dd4bf" stroke-width="4"/>
    <g>
      <rect x="472" y="132" width="70" height="260" rx="14" fill="#134e4a" stroke="#14b8a6"/>
      <rect x="554" y="132" width="70" height="260" rx="14" fill="#134e4a" stroke="#14b8a6"/>
      <rect x="636" y="132" width="70" height="260" rx="14" fill="#134e4a" stroke="#14b8a6"/>
      <text x="589" y="430" fill="#5eead4" font-size="17" text-anchor="middle">Flatten + Linear Projection</text>
      <text x="589" y="280" fill="#ccfbf1" font-size="18" text-anchor="middle" transform="rotate(-90 589 280)">Patch Embeddings</text>
    </g>
    <path d="M730 262h72" stroke="#64748b" stroke-width="4"/>
    <path d="m790 250 14 12-14 12" fill="none" stroke="#a78bfa" stroke-width="4"/>
    <rect x="830" y="122" width="298" height="280" rx="24" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2"/>
    <text x="979" y="170" fill="#ddd6fe" font-size="21" font-weight="700" text-anchor="middle">Transformer Encoder × L</text>
    <g fill="#312e81" stroke="#6366f1">
      <rect x="862" y="204" width="54" height="70" rx="10"/>
      <rect x="926" y="204" width="54" height="70" rx="10"/>
      <rect x="990" y="204" width="54" height="70" rx="10"/>
      <rect x="1054" y="204" width="42" height="70" rx="10"/>
    </g>
    <text x="889" y="247" fill="#f5f3ff" font-size="16" text-anchor="middle">CLS</text>
    <text x="979" y="316" fill="#c4b5fd" font-size="16" text-anchor="middle">+ Position Embeddings</text>
    <rect x="898" y="340" width="162" height="42" rx="12" fill="#4c1d95"/>
    <text x="979" y="367" fill="white" font-size="16" text-anchor="middle">Classification Head</text>
  </g>
</svg>
