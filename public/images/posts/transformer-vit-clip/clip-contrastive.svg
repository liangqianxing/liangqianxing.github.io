<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">CLIP 双塔对比学习</title>
  <desc id="desc">图像和文本分别编码，在相似度矩阵中拉近对角线配对并推远其他组合。</desc>
  <rect width="1200" height="650" rx="28" fill="#0b0f17"/>
  <text x="60" y="66" fill="#f8fafc" font-family="Arial,sans-serif" font-size="30" font-weight="700">CLIP: Contrastive Language–Image Pretraining</text>
  <g font-family="Arial,sans-serif">
    <rect x="70" y="132" width="250" height="102" rx="20" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
    <text x="195" y="176" fill="#dbeafe" font-size="21" font-weight="700" text-anchor="middle">Image Encoder</text>
    <text x="195" y="207" fill="#93c5fd" font-size="15" text-anchor="middle">ResNet or ViT</text>
    <rect x="70" y="362" width="250" height="102" rx="20" fill="#3b0764" stroke="#8b5cf6" stroke-width="2"/>
    <text x="195" y="406" fill="#ede9fe" font-size="21" font-weight="700" text-anchor="middle">Text Encoder</text>
    <text x="195" y="437" fill="#c4b5fd" font-size="15" text-anchor="middle">Transformer</text>
    <path d="M320 183h150M320 413h150" stroke="#64748b" stroke-width="4"/>
    <circle cx="510" cy="183" r="46" fill="#0f766e" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="510" cy="413" r="46" fill="#6d28d9" stroke="#a78bfa" stroke-width="2"/>
    <text x="510" y="190" fill="white" font-size="20" font-weight="700" text-anchor="middle">vᵢ</text>
    <text x="510" y="420" fill="white" font-size="20" font-weight="700" text-anchor="middle">tⱼ</text>
    <text x="510" y="266" fill="#94a3b8" font-size="15" text-anchor="middle">L2 Normalize</text>
    <path d="M556 183C630 183 640 246 688 270M556 413C630 413 640 350 688 326" fill="none" stroke="#64748b" stroke-width="4"/>
    <rect x="690" y="128" width="438" height="396" rx="26" fill="#111827" stroke="#334155" stroke-width="2"/>
    <text x="909" y="172" fill="#f8fafc" font-size="21" font-weight="700" text-anchor="middle">Image × Text Similarity</text>
    <g transform="translate(792 218)">
      <g fill="#1e293b" stroke="#475569">
        <rect x="0" y="0" width="64" height="64"/><rect x="64" y="0" width="64" height="64"/><rect x="128" y="0" width="64" height="64"/><rect x="192" y="0" width="64" height="64"/>
        <rect x="0" y="64" width="64" height="64"/><rect x="64" y="64" width="64" height="64"/><rect x="128" y="64" width="64" height="64"/><rect x="192" y="64" width="64" height="64"/>
        <rect x="0" y="128" width="64" height="64"/><rect x="64" y="128" width="64" height="64"/><rect x="128" y="128" width="64" height="64"/><rect x="192" y="128" width="64" height="64"/>
        <rect x="0" y="192" width="64" height="64"/><rect x="64" y="192" width="64" height="64"/><rect x="128" y="192" width="64" height="64"/><rect x="192" y="192" width="64" height="64"/>
      </g>
      <g fill="#0f766e" stroke="#5eead4" stroke-width="2">
        <rect x="0" y="0" width="64" height="64"/><rect x="64" y="64" width="64" height="64"/><rect x="128" y="128" width="64" height="64"/><rect x="192" y="192" width="64" height="64"/>
      </g>
      <g fill="white" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">
        <text x="32" y="38">+</text><text x="96" y="102">+</text><text x="160" y="166">+</text><text x="224" y="230">+</text>
      </g>
    </g>
    <text x="909" y="504" fill="#5eead4" font-size="16" text-anchor="middle">Diagonal = Positive Pairs · Others = Negatives</text>
    <text x="596" y="604" fill="#94a3b8" font-size="17" text-anchor="middle">Symmetric Cross-Entropy: image → text + text → image</text>
  </g>
</svg>
