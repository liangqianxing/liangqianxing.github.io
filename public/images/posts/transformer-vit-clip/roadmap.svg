<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Transformer、ViT 与 CLIP 演进关系</title>
  <desc id="desc">从序列注意力到图像 Patch，再到图文对比学习的技术路线。</desc>
  <rect width="1200" height="500" rx="28" fill="#0b0f17"/>
  <text x="64" y="72" fill="#f8fafc" font-family="Arial,sans-serif" font-size="30" font-weight="700">From Attention to Vision-Language Alignment</text>
  <text x="64" y="108" fill="#94a3b8" font-family="Arial,sans-serif" font-size="16">三篇代表论文，三次输入表示与训练目标的扩展</text>
  <path d="M354 276H438M762 276H846" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <path d="m426 264 14 12-14 12M834 264l14 12-14 12" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g>
    <rect x="62" y="160" width="292" height="238" rx="24" fill="#111827" stroke="#334155" stroke-width="2"/>
    <circle cx="106" cy="204" r="18" fill="#2563eb"/>
    <text x="98" y="211" fill="white" font-family="Arial,sans-serif" font-size="18" font-weight="700">1</text>
    <text x="140" y="211" fill="#f8fafc" font-family="Arial,sans-serif" font-size="25" font-weight="700">Transformer</text>
    <text x="88" y="258" fill="#60a5fa" font-family="Arial,sans-serif" font-size="16" font-weight="700">2017 · Sequence</text>
    <text x="88" y="304" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">Token + Position</text>
    <text x="88" y="338" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">Self-Attention</text>
    <text x="88" y="372" fill="#94a3b8" font-family="Arial,sans-serif" font-size="15">全局依赖与并行计算</text>
  </g>
  <g>
    <rect x="438" y="160" width="324" height="238" rx="24" fill="#111827" stroke="#334155" stroke-width="2"/>
    <circle cx="482" cy="204" r="18" fill="#0d9488"/>
    <text x="474" y="211" fill="white" font-family="Arial,sans-serif" font-size="18" font-weight="700">2</text>
    <text x="516" y="211" fill="#f8fafc" font-family="Arial,sans-serif" font-size="25" font-weight="700">Vision Transformer</text>
    <text x="464" y="258" fill="#2dd4bf" font-family="Arial,sans-serif" font-size="16" font-weight="700">2020 · Image</text>
    <text x="464" y="304" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">Patch + Position</text>
    <text x="464" y="338" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">Transformer Encoder</text>
    <text x="464" y="372" fill="#94a3b8" font-family="Arial,sans-serif" font-size="15">图像被转换为 token 序列</text>
  </g>
  <g>
    <rect x="846" y="160" width="292" height="238" rx="24" fill="#111827" stroke="#334155" stroke-width="2"/>
    <circle cx="890" cy="204" r="18" fill="#7c3aed"/>
    <text x="882" y="211" fill="white" font-family="Arial,sans-serif" font-size="18" font-weight="700">3</text>
    <text x="924" y="211" fill="#f8fafc" font-family="Arial,sans-serif" font-size="25" font-weight="700">CLIP</text>
    <text x="872" y="258" fill="#a78bfa" font-family="Arial,sans-serif" font-size="16" font-weight="700">2021 · Vision + Language</text>
    <text x="872" y="304" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">Image / Text Encoder</text>
    <text x="872" y="338" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">Contrastive Learning</text>
    <text x="872" y="372" fill="#94a3b8" font-family="Arial,sans-serif" font-size="15">共享语义空间与零样本迁移</text>
  </g>
</svg>
