<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">FP16 RMSNorm latency benchmark on RTX 4090D</title>
  <desc id="desc">Horizontal bar chart comparing torch.compile and custom CUDA latency for hot and cold cache modes.</desc>
  <rect width="1200" height="720" fill="#0b1220"/>
  <text x="70" y="68" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700">FP16 latency · 256 × 4096</text>
  <text x="70" y="104" fill="#94a3b8" font-family="Arial, sans-serif" font-size="18">RTX 4090D · CUDA 12.8 · lower is better</text>

  <rect x="730" y="45" width="18" height="18" fill="#94a3b8"/>
  <text x="758" y="60" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16">torch.compile</text>
  <rect x="910" y="45" width="18" height="18" fill="#34d399"/>
  <text x="938" y="60" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16">custom CUDA</text>

  <line x1="330" y1="150" x2="330" y2="640" stroke="#475569" stroke-width="2"/>
  <line x1="330" y1="640" x2="1110" y2="640" stroke="#475569" stroke-width="2"/>
  <g fill="#64748b" font-family="Arial, sans-serif" font-size="14">
    <text x="330" y="668" text-anchor="middle">0</text>
    <text x="452" y="668" text-anchor="middle">10</text>
    <text x="574" y="668" text-anchor="middle">20</text>
    <text x="696" y="668" text-anchor="middle">30</text>
    <text x="818" y="668" text-anchor="middle">40</text>
    <text x="940" y="668" text-anchor="middle">50</text>
    <text x="1062" y="668" text-anchor="middle">60 µs</text>
  </g>
  <g stroke="#1e293b" stroke-width="1">
    <line x1="452" y1="150" x2="452" y2="640"/>
    <line x1="574" y1="150" x2="574" y2="640"/>
    <line x1="696" y1="150" x2="696" y2="640"/>
    <line x1="818" y1="150" x2="818" y2="640"/>
    <line x1="940" y1="150" x2="940" y2="640"/>
    <line x1="1062" y1="150" x2="1062" y2="640"/>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="300" y="196" text-anchor="end" fill="#e2e8f0" font-size="17">Hot · RMSNorm</text>
    <rect x="330" y="169" width="428.5" height="22" rx="3" fill="#94a3b8"/>
    <rect x="330" y="199" width="83.7" height="22" rx="3" fill="#34d399"/>
    <text x="770" y="187" fill="#cbd5e1" font-size="14">35.122 µs</text>
    <text x="425" y="216" fill="#a7f3d0" font-size="14">6.861 µs · 5.12×</text>

    <text x="300" y="316" text-anchor="end" fill="#e2e8f0" font-size="17">Hot · Fused</text>
    <rect x="330" y="289" width="483.9" height="22" rx="3" fill="#94a3b8"/>
    <rect x="330" y="319" width="113.4" height="22" rx="3" fill="#34d399"/>
    <text x="825" y="307" fill="#cbd5e1" font-size="14">39.670 µs</text>
    <text x="455" y="336" fill="#a7f3d0" font-size="14">9.298 µs · 4.27×</text>

    <text x="300" y="436" text-anchor="end" fill="#e2e8f0" font-size="17">Cold · RMSNorm</text>
    <rect x="330" y="409" width="699.6" height="22" rx="3" fill="#94a3b8"/>
    <rect x="330" y="439" width="199.9" height="22" rx="3" fill="#34d399"/>
    <text x="1041" y="427" fill="#cbd5e1" font-size="14">57.344 µs</text>
    <text x="541" y="456" fill="#a7f3d0" font-size="14">16.384 µs · 3.50×</text>

    <text x="300" y="556" text-anchor="end" fill="#e2e8f0" font-size="17">Cold · Fused</text>
    <rect x="330" y="529" width="776.5" height="22" rx="3" fill="#94a3b8"/>
    <rect x="330" y="559" width="249.9" height="22" rx="3" fill="#34d399"/>
    <text x="1015" y="547" fill="#cbd5e1" font-size="14">63.648 µs</text>
    <text x="591" y="576" fill="#a7f3d0" font-size="14">20.480 µs · 3.11×</text>
  </g>
</svg>
