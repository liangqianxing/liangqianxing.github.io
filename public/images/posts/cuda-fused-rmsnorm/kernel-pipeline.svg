<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Fused residual add and RMSNorm CUDA kernel data flow</title>
  <desc id="desc">A block processes one token row using vector loads, FP32 accumulation, warp reduction, inverse RMS, and normalized output.</desc>
  <rect width="1200" height="620" fill="#0b1220"/>
  <text x="70" y="72" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700">Fused Add + RMSNorm</text>
  <text x="70" y="108" fill="#94a3b8" font-family="Arial, sans-serif" font-size="18">One CUDA block owns one token row · 256 threads · FP32 reduction</text>

  <rect x="70" y="170" width="180" height="100" rx="6" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
  <text x="160" y="210" text-anchor="middle" fill="#dbeafe" font-family="Arial, sans-serif" font-size="22" font-weight="700">x + residual</text>
  <text x="160" y="240" text-anchor="middle" fill="#93c5fd" font-family="Arial, sans-serif" font-size="16">pack-4 load</text>

  <path d="M250 220 H310" stroke="#64748b" stroke-width="3"/>
  <path d="M300 211 L314 220 L300 229" fill="none" stroke="#64748b" stroke-width="3"/>

  <rect x="315" y="170" width="190" height="100" rx="6" fill="#3f1d2e" stroke="#fb7185" stroke-width="2"/>
  <text x="410" y="207" text-anchor="middle" fill="#ffe4e6" font-family="Arial, sans-serif" font-size="21" font-weight="700">FP32 sum(x²)</text>
  <text x="410" y="239" text-anchor="middle" fill="#fda4af" font-family="Arial, sans-serif" font-size="16">thread-local</text>

  <path d="M505 220 H565" stroke="#64748b" stroke-width="3"/>
  <path d="M555 211 L569 220 L555 229" fill="none" stroke="#64748b" stroke-width="3"/>

  <rect x="570" y="170" width="190" height="100" rx="6" fill="#16352b" stroke="#34d399" stroke-width="2"/>
  <text x="665" y="207" text-anchor="middle" fill="#d1fae5" font-family="Arial, sans-serif" font-size="21" font-weight="700">Warp reduce</text>
  <text x="665" y="239" text-anchor="middle" fill="#6ee7b7" font-family="Arial, sans-serif" font-size="16">shuffle + 32B shared</text>

  <path d="M760 220 H820" stroke="#64748b" stroke-width="3"/>
  <path d="M810 211 L824 220 L810 229" fill="none" stroke="#64748b" stroke-width="3"/>

  <rect x="825" y="170" width="145" height="100" rx="6" fill="#3b2f12" stroke="#fbbf24" stroke-width="2"/>
  <text x="897" y="207" text-anchor="middle" fill="#fef3c7" font-family="Arial, sans-serif" font-size="21" font-weight="700">inv_rms</text>
  <text x="897" y="239" text-anchor="middle" fill="#fcd34d" font-family="Arial, sans-serif" font-size="16">rsqrtf</text>

  <path d="M970 220 H1030" stroke="#64748b" stroke-width="3"/>
  <path d="M1020 211 L1034 220 L1020 229" fill="none" stroke="#64748b" stroke-width="3"/>

  <rect x="1035" y="170" width="110" height="100" rx="6" fill="#2e1f4a" stroke="#c084fc" stroke-width="2"/>
  <text x="1090" y="207" text-anchor="middle" fill="#f3e8ff" font-family="Arial, sans-serif" font-size="19" font-weight="700">scale</text>
  <text x="1090" y="239" text-anchor="middle" fill="#d8b4fe" font-family="Arial, sans-serif" font-size="15">× weight</text>

  <rect x="70" y="350" width="1075" height="165" rx="6" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="100" y="392" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="20" font-weight="700">Memory traffic inside one launch</text>
  <circle cx="112" cy="438" r="7" fill="#60a5fa"/>
  <text x="132" y="445" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="17">First pass: read x + residual, write residual_out, accumulate squares</text>
  <circle cx="112" cy="480" r="7" fill="#c084fc"/>
  <text x="132" y="487" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="17">Second pass: read residual_out + weight, write normalized output</text>
  <text x="70" y="570" fill="#64748b" font-family="Arial, sans-serif" font-size="16">fast-llm-kernels · RTX 4090D · CUDA 12.8</text>
</svg>

