<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">RAG ingestion and query paths</title>
  <desc id="desc">Documents are chunked, embedded, and indexed offline. At query time the question is embedded, searched, reranked, assembled into a prompt, and answered by an LLM with evidence.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#58a6ff"/></marker></defs>
  <rect width="1200" height="560" rx="8" fill="#0d1117"/>
  <text x="56" y="62" fill="#f0f6fc" font-family="Arial,sans-serif" font-size="30" font-weight="700">RAG is two systems joined by one index</text>
  <text x="56" y="94" fill="#8b949e" font-family="Arial,sans-serif" font-size="16">An offline ingestion path prepares evidence; an online query path retrieves and grounds generation.</text>
  <g font-family="Arial,sans-serif">
    <text x="56" y="158" fill="#d29922" font-size="14" font-weight="700">OFFLINE · INGEST</text>
    <g fill="#161b22" stroke="#d29922"><rect x="56" y="184" width="144" height="62" rx="8"/><rect x="260" y="184" width="144" height="62" rx="8"/><rect x="464" y="184" width="144" height="62" rx="8"/></g>
    <text x="128" y="221" text-anchor="middle" fill="#f0f6fc" font-size="15">documents</text><text x="332" y="221" text-anchor="middle" fill="#f0f6fc" font-size="15">chunk + metadata</text><text x="536" y="221" text-anchor="middle" fill="#f0f6fc" font-size="15">embed</text>
    <path d="M200 215H256M404 215H460" stroke="#58a6ff" stroke-width="3" marker-end="url(#a)"/>

    <rect x="690" y="160" width="210" height="250" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="714" y="198" fill="#3fb950" font-size="14" font-weight="700">VECTOR INDEX</text>
    <circle cx="744" cy="250" r="8" fill="#58a6ff"/><circle cx="788" cy="230" r="8" fill="#58a6ff"/><circle cx="842" cy="266" r="8" fill="#d29922"/><circle cx="770" cy="306" r="8" fill="#bc8cff"/><circle cx="844" cy="330" r="8" fill="#3fb950"/><circle cx="732" cy="356" r="8" fill="#ff7b72"/>
    <path d="M744 250 788 230 842 266 844 330 770 306 732 356" fill="none" stroke="#484f58" stroke-width="2"/>
    <text x="795" y="390" text-anchor="middle" fill="#8b949e" font-size="12">ANN graph + document store</text>
    <path d="M608 215H686" stroke="#58a6ff" stroke-width="3" marker-end="url(#a)"/>

    <text x="56" y="336" fill="#bc8cff" font-size="14" font-weight="700">ONLINE · QUERY</text>
    <g fill="#161b22" stroke="#bc8cff"><rect x="56" y="362" width="144" height="62" rx="8"/><rect x="260" y="362" width="144" height="62" rx="8"/><rect x="958" y="362" width="186" height="62" rx="8"/></g>
    <text x="128" y="399" text-anchor="middle" fill="#f0f6fc" font-size="15">question</text><text x="332" y="399" text-anchor="middle" fill="#f0f6fc" font-size="15">query embedding</text><text x="1051" y="399" text-anchor="middle" fill="#f0f6fc" font-size="15">rerank top-k</text>
    <path d="M200 393H256M404 393H686" stroke="#58a6ff" stroke-width="3" marker-end="url(#a)"/>
    <path d="M900 384H954" stroke="#58a6ff" stroke-width="3" marker-end="url(#a)"/>

    <rect x="958" y="184" width="186" height="62" rx="8" fill="#161b22" stroke="#58a6ff"/>
    <text x="1051" y="209" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="700">PROMPT + LLM</text>
    <text x="1051" y="231" text-anchor="middle" fill="#8b949e" font-size="12">answer with citations</text>
    <path d="M1051 358V250" stroke="#58a6ff" stroke-width="3" marker-end="url(#a)"/>
    <rect x="260" y="468" width="884" height="48" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="702" y="498" text-anchor="middle" fill="#c9d1d9" font-size="14">Evaluate each boundary: recall -> ranking -> context quality -> grounded answer</text>
  </g>
</svg>
