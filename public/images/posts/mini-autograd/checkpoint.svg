<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Activation checkpointing trades compute for memory</title>
  <desc id="desc">The standard method saves every activation, while checkpointing saves only selected boundaries and recomputes missing activations during backward.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#58a6ff"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#ff7b72"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="8" fill="#0d1117"/>
  <text x="56" y="62" fill="#f0f6fc" font-family="Arial,sans-serif" font-size="30" font-weight="700">Activation checkpointing</text>
  <text x="56" y="94" fill="#8b949e" font-family="Arial,sans-serif" font-size="16">Store fewer intermediates during forward; recompute local segments when backward needs them.</text>

  <g font-family="Arial,sans-serif">
    <text x="56" y="160" fill="#d29922" font-size="15" font-weight="700">SAVE EVERY ACTIVATION</text>
    <text x="1008" y="160" fill="#d29922" font-size="14" text-anchor="middle">high memory</text>
    <path d="M152 220H984" stroke="#58a6ff" stroke-width="4" marker-end="url(#a)"/>
    <g fill="#161b22" stroke="#d29922" stroke-width="2">
      <rect x="88" y="190" width="96" height="60" rx="8"/><rect x="244" y="190" width="96" height="60" rx="8"/>
      <rect x="400" y="190" width="96" height="60" rx="8"/><rect x="556" y="190" width="96" height="60" rx="8"/>
      <rect x="712" y="190" width="96" height="60" rx="8"/><rect x="868" y="190" width="96" height="60" rx="8"/>
    </g>
    <g fill="#f0f6fc" font-size="16" text-anchor="middle">
      <text x="136" y="226">A0</text><text x="292" y="226">A1</text><text x="448" y="226">A2</text>
      <text x="604" y="226">A3</text><text x="760" y="226">A4</text><text x="916" y="226">A5</text>
    </g>
    <g fill="#d29922"><rect x="112" y="262" width="48" height="12" rx="4"/><rect x="268" y="262" width="48" height="12" rx="4"/><rect x="424" y="262" width="48" height="12" rx="4"/><rect x="580" y="262" width="48" height="12" rx="4"/><rect x="736" y="262" width="48" height="12" rx="4"/><rect x="892" y="262" width="48" height="12" rx="4"/></g>
    <text x="1040" y="226" fill="#8b949e" font-size="13">saved</text>

    <text x="56" y="350" fill="#3fb950" font-size="15" font-weight="700">SAVE CHECKPOINTS</text>
    <text x="1008" y="350" fill="#3fb950" font-size="14" text-anchor="middle">lower memory</text>
    <path d="M152 410H984" stroke="#58a6ff" stroke-width="4" marker-end="url(#a)"/>
    <g fill="#161b22" stroke="#30363d" stroke-width="2">
      <rect x="88" y="380" width="96" height="60" rx="8"/><rect x="244" y="380" width="96" height="60" rx="8"/>
      <rect x="400" y="380" width="96" height="60" rx="8"/><rect x="556" y="380" width="96" height="60" rx="8"/>
      <rect x="712" y="380" width="96" height="60" rx="8"/><rect x="868" y="380" width="96" height="60" rx="8"/>
    </g>
    <g fill="#f0f6fc" font-size="16" text-anchor="middle">
      <text x="136" y="416">A0</text><text x="292" y="416">A1</text><text x="448" y="416">A2</text>
      <text x="604" y="416">A3</text><text x="760" y="416">A4</text><text x="916" y="416">A5</text>
    </g>
    <g fill="#3fb950"><rect x="112" y="452" width="48" height="12" rx="4"/><rect x="424" y="452" width="48" height="12" rx="4"/><rect x="892" y="452" width="48" height="12" rx="4"/></g>
    <path d="M440 482C376 522 230 518 140 464" fill="none" stroke="#ff7b72" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#r)"/>
    <path d="M908 482C844 522 604 518 456 464" fill="none" stroke="#ff7b72" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#r)"/>
    <text x="292" y="526" fill="#ff7b72" font-size="13" text-anchor="middle">recompute segment</text>
    <text x="682" y="526" fill="#ff7b72" font-size="13" text-anchor="middle">recompute segment</text>
  </g>
</svg>
