<svg xmlns="http://www.w3.org/2000/svg" width="640" height="740" viewBox="0 0 640 740" role="img" aria-labelledby="title desc">
<title id="title">先学规则，再用规则</title>
<desc id="desc">训练将语料转为 UTF-8 字节，反复统计并合并最高频相邻对，得到词表和有序合并规则。编码按 rank 应用规则；解码拼接 token 对应的字节后统一解码。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#65777b" stroke-width="1.6" stroke-linejoin="round"/></marker></defs>
<g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
<rect x="0" y="0" width="640" height="740" rx="0" fill="#fffdf8" stroke="none" stroke-width="1.5"/>
<text x="36" y="36" font-size="17" fill="#216b70" font-weight="600" text-anchor="start">BPE / 从零理解</text>
<text x="36" y="79" font-size="32" fill="#203f43" font-weight="700" text-anchor="start">先学规则，再用规则</text>
<text x="36" y="113" font-size="21" fill="#65777b" font-weight="400" text-anchor="start">训练建立词表；编码遵循已学到的合并顺序。</text>
<text x="603" y="47" font-size="24" fill="#79629c" font-weight="400" text-anchor="end">01</text>
<rect x="32" y="140" width="576" height="300" rx="18" fill="#e7f3ef" stroke="#dbe5e5" stroke-width="1.5"/>
<text x="54" y="179" font-size="27" fill="#216b70" font-weight="700" text-anchor="start">训练 / Learn</text>
<rect x="54" y="198" width="532" height="61" rx="12" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="320" y="238" font-size="27" fill="#203f43" font-weight="400" text-anchor="middle">语料 → UTF-8 字节序列</text>
<path d="M 320 266 L 320 283" fill="none" stroke="#65777b" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="54" y="291" width="532" height="61" rx="12" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="320" y="331" font-size="26" fill="#203f43" font-weight="400" text-anchor="middle">统计相邻对 → 合并最高频对</text>
<path d="M 570 320 L 597 320 L 597 271 L 556 271" fill="none" stroke="#65777b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="54" y="390" font-size="23" fill="#216b70" font-weight="400" text-anchor="start">反复更新序列，直到达到词表上限</text>
<text x="54" y="420" font-size="21" fill="#65777b" font-weight="400" text-anchor="start">无可合并对时也会提前停止</text>
<path d="M 320 449 L 320 466" fill="none" stroke="#65777b" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="32" y="476" width="576" height="82" rx="18" fill="#f0eafa" stroke="none" stroke-width="1.5"/>
<text x="320" y="510" font-size="21" fill="#79629c" font-weight="600" text-anchor="middle">训练产物</text>
<text x="320" y="544" font-size="27" fill="#79629c" font-weight="600" text-anchor="middle">词表 + 有序合并规则（rank）</text>
<rect x="32" y="578" width="576" height="95" rx="18" fill="#eaf2fa" stroke="none" stroke-width="1.5"/>
<text x="54" y="616" font-size="25" fill="#416d91" font-weight="700" text-anchor="start">编码</text>
<text x="143" y="616" font-size="25" fill="#203f43" font-weight="400" text-anchor="start">文本 → 按 rank 合并 → token ID</text>
<text x="54" y="653" font-size="25" fill="#416d91" font-weight="700" text-anchor="start">解码</text>
<text x="143" y="653" font-size="25" fill="#203f43" font-weight="400" text-anchor="start">ID → 拼接全部字节 → 文本</text>
<path d="M 36 691 L 604 691" fill="none" stroke="#dbe5e5" stroke-width="2.4" stroke-linecap="round"/>
<text x="36" y="717" font-size="16" fill="#65777b" font-weight="400" text-anchor="start">原创教学示意 · gu.log</text>
<text x="604" y="717" font-size="15" fill="#65777b" font-weight="400" text-anchor="end" font-family="Consolas, DejaVu Sans Mono, Microsoft YaHei, monospace" xml:space="preserve">BPE TOKENIZER</text>
</g>
</svg>
