<svg xmlns="http://www.w3.org/2000/svg" width="640" height="853" viewBox="0 0 640 853" role="img" aria-labelledby="title desc">
<title id="title">编码时，rank 决定合并顺序</title>
<desc id="desc">rank 0 合并 b c 为 256，rank 1 合并 a b 为 257，rank 2 合并 a 与 256 为 258。正确编码先得到 a、bc，rank 1 不再匹配，再得到 abc。若忽略 rank 先合并 a b，则得到 ab、c，后续规则无法继续合并。这个错误分支不是最长词表匹配。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#65777b" stroke-width="1.6" stroke-linejoin="round"/></marker></defs>
<g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
<rect x="0" y="0" width="640" height="853" rx="0" fill="#fffdf8" stroke="none" stroke-width="1.5"/>
<text x="36" y="36" font-size="17" fill="#216b70" font-weight="600" text-anchor="start">BPE / 从零理解</text>
<text x="36" y="79" font-size="32" fill="#203f43" font-weight="700" text-anchor="start">编码时，rank 决定合并顺序</text>
<text x="36" y="113" font-size="21" fill="#65777b" font-weight="400" text-anchor="start">沿用正文的三条规则，输入为 “abc”。</text>
<text x="603" y="47" font-size="24" fill="#79629c" font-weight="400" text-anchor="end">05</text>
<rect x="32" y="142" width="576" height="156" rx="18" fill="#f0eafa" stroke="none" stroke-width="1.5"/>
<text x="54" y="186" font-size="25" fill="#79629c" font-weight="400" text-anchor="start" font-family="Consolas, DejaVu Sans Mono, Microsoft YaHei, monospace" xml:space="preserve">rank 0   b + c  → bc    ID 256</text>
<text x="54" y="228" font-size="25" fill="#79629c" font-weight="400" text-anchor="start" font-family="Consolas, DejaVu Sans Mono, Microsoft YaHei, monospace" xml:space="preserve">rank 1   a + b  → ab    ID 257</text>
<text x="54" y="270" font-size="25" fill="#79629c" font-weight="400" text-anchor="start" font-family="Consolas, DejaVu Sans Mono, Microsoft YaHei, monospace" xml:space="preserve">rank 2   a + bc → abc   ID 258</text>
<rect x="32" y="321" width="576" height="290" rx="18" fill="#e7f3ef" stroke="none" stroke-width="1.5"/>
<text x="54" y="363" font-size="27" fill="#216b70" font-weight="700" text-anchor="start">按 rank：先 bc，再 abc</text>
<rect x="75" y="383" width="146" height="88" rx="13" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="148.0" y="422" font-size="30" fill="#216b70" font-weight="600" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, Microsoft YaHei, monospace" xml:space="preserve">a</text>
<text x="148.0" y="453" font-size="20" fill="#65777b" font-weight="400" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, Microsoft YaHei, monospace" xml:space="preserve">ID 97</text>
<rect x="247" y="383" width="146" height="88" rx="13" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="320.0" y="422" font-size="30" fill="#216b70" font-weight="600" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, Microsoft YaHei, monospace" xml:space="preserve">b</text>
<text x="320.0" y="453" font-size="20" fill="#65777b" font-weight="400" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, Microsoft YaHei, monospace" xml:space="preserve">ID 98</text>
<rect x="419" y="383" width="146" height="88" rx="13" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="492.0" y="422" font-size="30" fill="#216b70" font-weight="600" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, Microsoft YaHei, monospace" xml:space="preserve">c</text>
<text x="492.0" y="453" font-size="20" fill="#65777b" font-weight="400" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, Microsoft YaHei, monospace" xml:space="preserve">ID 99</text>
<path d="M 320 478 L 320 499" fill="none" stroke="#65777b" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="320" y="535" font-size="30" fill="#216b70" font-weight="600" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, Microsoft YaHei, monospace" xml:space="preserve">[ a | bc ]  →  [ abc ]</text>
<text x="320" y="574" font-size="23" fill="#216b70" font-weight="400" text-anchor="middle">rank 1 已无 a+b；rank 2 合并 a+bc</text>
<rect x="32" y="634" width="576" height="150" rx="18" fill="#fcebe1" stroke="none" stroke-width="1.5"/>
<text x="54" y="675" font-size="27" fill="#a95d43" font-weight="700" text-anchor="start">忽略 rank：先合并 ab</text>
<text x="320" y="721" font-size="30" fill="#a95d43" font-weight="400" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, Microsoft YaHei, monospace" xml:space="preserve">[ ab | c ]  =  [257, 99]</text>
<text x="320" y="760" font-size="23" fill="#a95d43" font-weight="400" text-anchor="middle">没有 ab+c 规则，无法得到 [258]</text>
<path d="M 36 804 L 604 804" fill="none" stroke="#dbe5e5" stroke-width="2.4" stroke-linecap="round"/>
<text x="36" y="830" font-size="16" fill="#65777b" font-weight="400" text-anchor="start">原创教学示意 · gu.log</text>
<text x="604" y="830" font-size="15" fill="#65777b" font-weight="400" text-anchor="end" font-family="Consolas, DejaVu Sans Mono, Microsoft YaHei, monospace" xml:space="preserve">BPE TOKENIZER</text>
</g>
</svg>
