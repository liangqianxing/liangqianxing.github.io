<svg xmlns="http://www.w3.org/2000/svg" width="640" height="804" viewBox="0 0 640 804" role="img" aria-labelledby="title desc">
<title id="title">“abab” 如何变成一个 token</title>
<desc id="desc">初始字节序列为 97、98、97、98。第一轮 a b 出现两次，b a 出现一次，合并 a b 为 token 256，得到 256、256。第二轮合并 256、256 为 257。词表保留 256 个基础字节，再增加 ab 与 abab 两项。</desc>
