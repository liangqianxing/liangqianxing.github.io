<svg xmlns="http://www.w3.org/2000/svg" width="640" height="742" viewBox="0 0 640 742" role="img" aria-labelledby="title desc">
<title id="title">边界保留下来，BPE 各自进行</title>
<desc id="desc">输入 Hi,&lt;eos&gt; 世界!。允许 eos 特殊 token 时，先识别并隔离 eos；普通片段依字符类别拆成 Hi、逗号、空格、世界、感叹号。各片段独立应用 BPE，不能跨片段或特殊 token 边界。空格仍被保留；未允许的 eos 将按普通文本处理。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#65777b" stroke-width="1.6" stroke-linejoin="round"/></marker></defs>
<g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
<rect x="0" y="0" width="640" height="742" rx="0" fill="#fffdf8" stroke="none" stroke-width="1.5"/>
<text x="36" y="36" font-size="17" fill="#216b70" font-weight="600" text-anchor="start">BPE / 从零理解</text>
<text x="36" y="79" font-size="32" fill="#203f43" font-weight="700" text-anchor="start">边界保留下来，BPE 各自进行</text>
<text x="36" y="113" font-size="21" fill="#65777b" font-weight="400" text-anchor="start">示例：先允许 &lt;eos&gt;，再处理普通文本。</text>
<text x="603" y="47" font-size="24" fill="#79629c" font-weight="400" text-anchor="end">06</text>
<rect x="32" y="143" width="576" height="95" rx="18" fill="#ffffff" stroke="#dbe5e5" stroke-width="1.5"/>
<text x="320" y="186" font-size="36" fill="#203f43" font-weight="600" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, Microsoft YaHei, monospace" xml:space="preserve">Hi,&lt;eos&gt; 世界!</text>
<text x="320" y="216" font-size="23" fill="#79629c" font-weight="400" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, Microsoft YaHei, monospace" xml:space="preserve">allowed_special = {&quot;&lt;eos&gt;&quot;}</text>
<path d="M 320 245 L 320 269" fill="none" stroke="#65777b" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="36" y="305" font-size="26" fill="#79629c" font-weight="600" text-anchor="start">① 先识别并隔离特殊 token</text>
<rect x="32" y="323" width="174" height="60" rx="13" fill="#eaf2fa" stroke="none" stroke-width="1.5"/>
<text x="119.0" y="362" font-size="30" fill="#416d91" font-weight="600" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, Microsoft YaHei, monospace" xml:space="preserve">Hi,</text>
<rect x="224" y="323" width="192" height="60" rx="13" fill="#f0eafa" stroke="none" stroke-width="1.5"/>
<text x="320.0" y="362" font-size="30" fill="#79629c" font-weight="600" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, Microsoft YaHei, monospace" xml:space="preserve">&lt;eos&gt;</text>
<rect x="434" y="323" width="174" height="60" rx="13" fill="#eaf2fa" stroke="none" stroke-width="1.5"/>
<text x="521.0" y="362" font-size="30" fill="#416d91" font-weight="600" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, Microsoft YaHei, monospace" xml:space="preserve"> 世界!</text>
<text x="320" y="415" font-size="25" fill="#79629c" font-weight="400" text-anchor="middle">&lt;eos&gt; → 单个专用 token ID</text>
<text x="36" y="460" font-size="25" fill="#416d91" font-weight="600" text-anchor="start">② 普通文本分段后，独立应用 BPE</text>
<rect x="32" y="482" width="96" height="60" rx="13" fill="#eaf2fa" stroke="none" stroke-width="1.5"/>
<text x="80.0" y="521" font-size="30" fill="#416d91" font-weight="600" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, Microsoft YaHei, monospace" xml:space="preserve">Hi</text>
<rect x="144" y="482" width="64" height="60" rx="13" fill="#eaf2fa" stroke="none" stroke-width="1.5"/>
<text x="176.0" y="521" font-size="30" fill="#416d91" font-weight="600" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, Microsoft YaHei, monospace" xml:space="preserve">,</text>
<rect x="224" y="482" width="144" height="60" rx="13" fill="#f0eafa" stroke="none" stroke-width="1.5"/>
<text x="296.0" y="521" font-size="30" fill="#79629c" font-weight="600" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, Microsoft YaHei, monospace" xml:space="preserve">&lt;eos&gt;</text>
<rect x="384" y="482" width="64" height="60" rx="13" fill="#fcebe1" stroke="none" stroke-width="1.5"/>
<text x="416.0" y="521" font-size="30" fill="#a95d43" font-weight="600" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, Microsoft YaHei, monospace" xml:space="preserve">␠</text>
<rect x="464" y="482" width="80" height="60" rx="13" fill="#eaf2fa" stroke="none" stroke-width="1.5"/>
<text x="504.0" y="521" font-size="30" fill="#416d91" font-weight="600" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, Microsoft YaHei, monospace" xml:space="preserve">世界</text>
<rect x="560" y="482" width="48" height="60" rx="13" fill="#eaf2fa" stroke="none" stroke-width="1.5"/>
<text x="584.0" y="521" font-size="30" fill="#416d91" font-weight="600" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, Microsoft YaHei, monospace" xml:space="preserve">!</text>
<path d="M 136 475 L 136 551" fill="none" stroke="#79629c" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="6 6"/>
<path d="M 216 475 L 216 551" fill="none" stroke="#79629c" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="6 6"/>
<path d="M 376 475 L 376 551" fill="none" stroke="#79629c" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="6 6"/>
<path d="M 456 475 L 456 551" fill="none" stroke="#79629c" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="6 6"/>
<path d="M 552 475 L 552 551" fill="none" stroke="#79629c" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="6 6"/>
<rect x="32" y="574" width="576" height="102" rx="18" fill="#e7f3ef" stroke="none" stroke-width="1.5"/>
<text x="320" y="611" font-size="28" fill="#216b70" font-weight="600" text-anchor="middle">空格保留 · 不跨边界合并</text>
<text x="320" y="646" font-size="23" fill="#216b70" font-weight="400" text-anchor="middle">未允许的 &lt;eos&gt; 则按普通文本处理</text>
<path d="M 36 693 L 604 693" fill="none" stroke="#dbe5e5" stroke-width="2.4" stroke-linecap="round"/>
<text x="36" y="719" font-size="16" fill="#65777b" font-weight="400" text-anchor="start">原创教学示意 · gu.log</text>
<text x="604" y="719" font-size="15" fill="#65777b" font-weight="400" text-anchor="end" font-family="Consolas, DejaVu Sans Mono, Microsoft YaHei, monospace" xml:space="preserve">BPE TOKENIZER</text>
</g>
</svg>
