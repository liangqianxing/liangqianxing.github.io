<text x="421.5" y="443" font-size="30" fill="#a95d43" font-weight="600" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, Microsoft YaHei, monospace" xml:space="preserve">153</text>
<rect x="477" y="404" width="91" height="60" rx="13" fill="#fcebe1" stroke="none" stroke-width="1.5"/>
<text x="522.5" y="443" font-size="30" fill="#a95d43" font-weight="600" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, Microsoft YaHei, monospace" xml:space="preserve">130</text>
<rect x="32" y="508" width="576" height="95" rx="18" fill="#e7f3ef" stroke="none" stroke-width="1.5"/>
<text x="320" y="549" font-size="30" fill="#216b70" font-weight="600" text-anchor="middle">[228, 184, 173] → “中”</text>
<text x="320" y="582" font-size="23" fill="#216b70" font-weight="400" text-anchor="middle">先拼接完整字节，再统一 decode</text>
