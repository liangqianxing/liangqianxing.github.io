<text x="219.5" y="324" font-size="30" fill="#416d91" font-weight="600" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, Microsoft YaHei, monospace" xml:space="preserve">228</text>
<rect x="275" y="285" width="91" height="60" rx="13" fill="#eaf2fa" stroke="none" stroke-width="1.5"/>
<text x="320.5" y="324" font-size="30" fill="#416d91" font-weight="600" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, Microsoft YaHei, monospace" xml:space="preserve">184</text>
<rect x="376" y="285" width="91" height="60" rx="13" fill="#eaf2fa" stroke="none" stroke-width="1.5"/>
<text x="421.5" y="324" font-size="30" fill="#416d91" font-weight="600" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, Microsoft YaHei, monospace" xml:space="preserve">173</text>
<rect x="32" y="384" width="576" height="99" rx="18" fill="#ffffff" stroke="#dbe5e5" stroke-width="1.5"/>
<text x="81" y="435" font-size="40" fill="#203f43" font-weight="600" text-anchor="middle">🙂</text>
<text x="81" y="466" font-size="19" fill="#65777b" font-weight="400" text-anchor="middle">4 字节</text>
<path d="M 133 433 L 160 433" fill="none" stroke="#65777b" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="174" y="404" width="91" height="60" rx="13" fill="#fcebe1" stroke="none" stroke-width="1.5"/>
<text x="219.5" y="443" font-size="30" fill="#a95d43" font-weight="600" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, Microsoft YaHei, monospace" xml:space="preserve">240</text>
