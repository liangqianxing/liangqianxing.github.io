<svg xmlns="http://www.w3.org/2000/svg" width="640" height="670" viewBox="0 0 640 670" role="img" aria-labelledby="title desc">
<title id="title">一个字符，可以有多个字节</title>
<desc id="desc">A 的 UTF-8 字节为 65；中的字节为 228、184、173；笑脸的字节为 240、159、153、130。多字节字符不能逐字节解码，应先拼接完整字节序列再统一解码。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#65777b" stroke-width="1.6" stroke-linejoin="round"/></marker></defs>
<g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
<rect x="0" y="0" width="640" height="670" rx="0" fill="#fffdf8" stroke="none" stroke-width="1.5"/>
<text x="36" y="36" font-size="17" fill="#216b70" font-weight="600" text-anchor="start">BPE / 从零理解</text>
<text x="36" y="79" font-size="32" fill="#203f43" font-weight="700" text-anchor="start">一个字符，可以有多个字节</text>
<text x="36" y="113" font-size="21" fill="#65777b" font-weight="400" text-anchor="start">图中的数字均为 UTF-8 字节的十进制值。</text>
<text x="603" y="47" font-size="24" fill="#79629c" font-weight="400" text-anchor="end">02</text>
<rect x="32" y="146" width="576" height="99" rx="18" fill="#ffffff" stroke="#dbe5e5" stroke-width="1.5"/>
<text x="81" y="197" font-size="40" fill="#203f43" font-weight="600" text-anchor="middle">A</text>
<text x="81" y="228" font-size="19" fill="#65777b" font-weight="400" text-anchor="middle">1 字节</text>
<path d="M 133 195 L 160 195" fill="none" stroke="#65777b" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="174" y="166" width="91" height="60" rx="13" fill="#e7f3ef" stroke="none" stroke-width="1.5"/>
<text x="219.5" y="205" font-size="30" fill="#216b70" font-weight="600" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, Microsoft YaHei, monospace" xml:space="preserve">65</text>
<rect x="32" y="265" width="576" height="99" rx="18" fill="#ffffff" stroke="#dbe5e5" stroke-width="1.5"/>
<text x="81" y="316" font-size="40" fill="#203f43" font-weight="600" text-anchor="middle">中</text>
<text x="81" y="347" font-size="19" fill="#65777b" font-weight="400" text-anchor="middle">3 字节</text>
<path d="M 133 314 L 160 314" fill="none" stroke="#65777b" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/>
