<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" fill="none">
  <title>机器学习系统课程封面</title>
  <desc>紫色计算芯片连接张量矩阵与神经网络节点，橙色线条表示数据流。</desc>
  <defs>
    <linearGradient id="background" x1="40" y1="0" x2="590" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5F0FC"/>
      <stop offset="1" stop-color="#E9E3F4"/>
    </linearGradient>
    <linearGradient id="chip" x1="236" y1="120" x2="410" y2="285" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8470A7"/>
      <stop offset="1" stop-color="#594877"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#A89ABC" stroke-opacity=".14"/>
    </pattern>
  </defs>

  <path fill="url(#background)" d="M0 0h640v400H0z"/>
  <path fill="url(#grid)" d="M0 0h640v400H0z"/>
  <circle cx="330" cy="204" r="150" stroke="#D7CCE7" stroke-width="1.5"/>
  <circle cx="330" cy="204" r="176" stroke="#DDD4E9" stroke-dasharray="3 9"/>

  <!-- Tensor tiles and their route into the compute chip. -->
  <rect x="56" y="109" width="116" height="116" rx="13" fill="#E1D7ED" stroke="#C6B7D9"/>
  <rect x="46" y="99" width="116" height="116" rx="13" fill="#F8F5FC" stroke="#BBAACF" stroke-width="2"/>
  <g fill="#B6A1CC">
    <rect x="64" y="117" width="22" height="22" rx="4"/>
    <rect x="93" y="117" width="22" height="22" rx="4"/>
    <rect x="122" y="117" width="22" height="22" rx="4"/>
    <rect x="64" y="146" width="22" height="22" rx="4"/>
    <rect x="93" y="146" width="22" height="22" rx="4" fill="#D29A72"/>
    <rect x="122" y="146" width="22" height="22" rx="4"/>
    <rect x="64" y="175" width="22" height="22" rx="4"/>
    <rect x="93" y="175" width="22" height="22" rx="4"/>
    <rect x="122" y="175" width="22" height="22" rx="4"/>
  </g>
  <path d="M164 157H192Q202 157 202 167V184Q202 194 212 194H239" stroke="#C7885E" stroke-width="4" stroke-linecap="round"/>
  <circle cx="196" cy="159" r="5" fill="#C7885E"/>

  <!-- Chip pins, lower layer, and compute surface. -->
  <g stroke="#A995C2" stroke-width="7" stroke-linecap="round">
    <path d="M272 105v24m28-24v24m28-24v24m28-24v24m28-24v24"/>
    <path d="M272 283v24m28-24v24m28-24v24m28-24v24m28-24v24"/>
    <path d="M229 150h24m-24 28h24m-24 28h24m-24 28h24m-24 28h24"/>
    <path d="M407 150h24m-24 28h24m-24 28h24m-24 28h24m-24 28h24"/>
  </g>
  <rect x="251" y="137" width="162" height="162" rx="25" fill="#C7B7DB"/>
  <rect x="241" y="123" width="174" height="168" rx="25" fill="url(#chip)" stroke="#5B487A" stroke-width="2"/>
  <rect x="261" y="143" width="134" height="128" rx="14" stroke="#D8C9EB" stroke-opacity=".65" stroke-width="1.5"/>
  <g fill="#E2D7F0">
    <rect x="280" y="163" width="25" height="25" rx="4"/>
    <rect x="315" y="163" width="25" height="25" rx="4"/>
    <rect x="350" y="163" width="25" height="25" rx="4"/>
    <rect x="280" y="198" width="25" height="25" rx="4"/>
    <rect x="315" y="198" width="25" height="25" rx="4" fill="#ECB98F"/>
    <rect x="350" y="198" width="25" height="25" rx="4"/>
  </g>
  <path d="M281 247h56m10 0h27" stroke="#BEACD4" stroke-width="4" stroke-linecap="round"/>

  <!-- A compact network on the output side. -->
  <path d="M432 205H454Q464 205 464 195V154Q464 144 474 144H496" stroke="#C7885E" stroke-width="4" stroke-linecap="round"/>
  <g stroke="#B5A1CC" stroke-width="2.5">
    <path d="m504 144 64-32m-64 32 64 64m-64-64 0 112m0 0 64-144m-64 144 64-48m-64 48 64 48"/>
  </g>
  <g fill="#FBF9FE" stroke="#9277B1" stroke-width="3">
    <circle cx="504" cy="144" r="13"/>
    <circle cx="504" cy="256" r="13"/>
    <circle cx="568" cy="112" r="13"/>
    <circle cx="568" cy="208" r="13"/>
    <circle cx="568" cy="304" r="13"/>
  </g>
  <circle cx="568" cy="208" r="6" fill="#CB8E66"/>

  <!-- Small paper-like details balance the illustration at thumbnail size. -->
  <path d="M61 285h89m-89 12h59m-59 12h74" stroke="#BAA8CD" stroke-width="4" stroke-linecap="round"/>
  <path d="M46 42h36m-36 0v21M594 358h-36m36 0v-21" stroke="#B9A8CC" stroke-width="2" stroke-linecap="round"/>
  <circle cx="184" cy="296" r="5" fill="#C99068"/>
  <circle cx="450" cy="82" r="5" fill="#C99068"/>
</svg>
