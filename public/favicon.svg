<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="fav-title">
  <title id="fav-title">gu.log</title>
  <defs>
    <linearGradient id="f-cover" x1="6" y1="2" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#383047"/>
      <stop offset="55%" stop-color="#262034"/>
      <stop offset="100%" stop-color="#171320"/>
    </linearGradient>
    <radialGradient id="f-glow" cx="50" cy="12" r="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9A7EC2" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#7CD4FF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#171320" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="f-spine" x1="0" y1="0" x2="13" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D1827"/>
      <stop offset="100%" stop-color="#0E0B14"/>
    </linearGradient>
    <linearGradient id="f-paper" x1="16" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="70%" stop-color="#FAF4EC"/>
      <stop offset="100%" stop-color="#EFE5D8"/>
    </linearGradient>
    <linearGradient id="f-fold" x1="40" y1="8" x2="54" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EFE7FA"/>
      <stop offset="100%" stop-color="#C6B4DF"/>
    </linearGradient>
    <linearGradient id="f-cursor" x1="35" y1="38" x2="47" y2="43" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7B619E"/>
      <stop offset="100%" stop-color="#584278"/>
    </linearGradient>
    <linearGradient id="f-star" x1="46" y1="7" x2="54" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF8E6"/>
      <stop offset="55%" stop-color="#F2CE86"/>
      <stop offset="100%" stop-color="#E59872"/>
    </linearGradient>
    <clipPath id="f-squircle">
      <rect width="64" height="64" rx="15"/>
    </clipPath>
  </defs>

  <g clip-path="url(#f-squircle)">
    <!-- 1. Full-bleed Hardcover Base & Spine -->
    <rect width="64" height="64" fill="url(#f-cover)"/>
    <rect width="64" height="64" fill="url(#f-glow)"/>
    <rect x="0" y="0" width="12" height="64" fill="url(#f-spine)"/>
    <line x1="12" y1="0" x2="12" y2="64" stroke="#C8B4E3" stroke-opacity="0.22" stroke-width="1.5"/>

    <!-- 2. High-contrast Dog-Eared Manuscript Page (aligned to 4px/8px grid for 16x16 crispness) -->
    <path d="M20 8H40L54 22V52C54 54.2091 52.2091 56 50 56H20C17.7909 56 16 54.2091 16 52V12C16 9.79086 17.7909 8 20 8Z" fill="url(#f-paper)"/>

    <!-- 3. Woven Bookmark Ribbon wrapping over top edge of page -->
    <path d="M22.5 0H28.5V13.5L25.5 11.5L22.5 13.5V0Z" fill="#D97F6C"/>

    <!-- 4. Folded Corner Flap -->
    <path d="M40 8V18C40 20.2091 41.7909 22 44 22H54L40 8Z" fill="url(#f-fold)"/>

    <!-- 5. Bold Terminal Prompt (`>_`) with high WCAG contrast on cream paper -->
    <path d="M23.5 24.5L32.5 32.5L23.5 40.5" fill="none" stroke="#261F34" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M35.5 40.5H46.5" fill="none" stroke="url(#f-cursor)" stroke-width="4.6" stroke-linecap="round"/>

    <!-- 6. 4-Point Curiosity Spark (`✦`) in top-right dark negative space -->
    <path d="M50 6.5C50.4 9.5 51 10.1 54 10.5C51 10.9 50.4 11.5 50 14.5C49.6 11.5 49 10.9 46 10.5C49 10.1 49.6 9.5 50 6.5Z" fill="url(#f-star)"/>
  </g>

  <!-- 7. Crisp 1.5px Inner Specular Rim -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="#FFFDF8" stroke-opacity="0.18" stroke-width="1.5"/>
</svg>
